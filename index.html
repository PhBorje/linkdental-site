<style>
:root {
  --brand-deep: #243b2a;
  --mint: #9fd08f;
  --f-body: "Montserrat", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-display: "Barlow Condensed", "Arial Narrow", ui-sans-serif, system-ui, sans-serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; overflow-x: clip; }
body {
  min-height: 100vh; min-height: 100svh;
  background: var(--brand-deep); color: #fff;
  font: 500 15px/1.5 var(--f-body);
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  display: grid; grid-template-rows: 1fr auto;
  position: relative; overflow: clip;
}

/* Anéis decorativos, como .st-hero-ring do site */
.ring { position: absolute; border-radius: 50%; aspect-ratio: 1; pointer-events: none; }
.ring-1 { --s: clamp(560px, 70vmax, 1600px); width: var(--s); right: calc(var(--s) * -.34); top: calc(var(--s) * -.42); border: calc(var(--s) * .145) solid rgb(255 255 255 / .045); }
.ring-2 { --s: clamp(320px, 38vmax, 900px); width: var(--s); left: calc(var(--s) * -.57); bottom: calc(var(--s) * -.62); border: calc(var(--s) * .143) solid rgb(159 208 143 / .07); }

main {
  position: relative; z-index: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  padding: 48px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px));
  gap: clamp(32px, 6vh, 64px);
}

/* Marca Link Dental: mesmas regras de .ld-logo / .ld-escuro (prototipo/css/marca.css) */
.ld-logo {
  --ld-a1: #d4fecf; --ld-a2: #a2e5b0; --ld-b: #86d79f; --ld-link: #ffffff; --ld-dental: #b2f0b2;
  display: inline-flex; align-items: center; gap: .55em; line-height: 1; white-space: nowrap;
  font-size: clamp(24px, 3.4vw + 14px, 58px);
}
.ld-simb { height: 2.05em; width: auto; flex: none; overflow: visible; }
.ld-nome { font-family: "Poppins", var(--f-body); font-weight: 700; letter-spacing: .12em; font-size: 1em; text-transform: uppercase; }
.ld-nome b { font-weight: 700; color: var(--ld-link); }
.ld-nome i { font-style: normal; color: var(--ld-dental); margin-left: .36em; }

h1 {
  margin: 0; max-width: 12ch;
  font-family: var(--f-display); font-weight: 600;
  font-size: clamp(52px, 9vw + 16px, 168px); line-height: .9; letter-spacing: -.005em;
  text-transform: uppercase; text-wrap: balance;
}
h1 span { color: var(--mint); }

footer {
  position: relative; z-index: 1; text-align: center;
  padding: 0 16px max(20px, env(safe-area-inset-bottom, 0px));
  font-size: 12px; letter-spacing: .04em; color: rgb(255 255 255 / .68);
}

@media (prefers-reduced-motion: no-preference) {
  main > * { animation: chega .9s cubic-bezier(.22, 1, .36, 1) both; }
  main > h1 { animation-delay: .12s; }
  @keyframes chega { from { opacity: 0; transform: translateY(10px); } }
}
</style>
</head>

<div class="ring ring-1" aria-hidden="true"></div>
<div class="ring ring-2" aria-hidden="true"></div>

      <path d="M0.6 6.8C0.2 1.2 8.2 0 12.6 3.2C17 0 25 1.2 24.6 6.8C25.2 14.4 22.6 18.4 21 27.2C19.8 35.2 16.6 38.4 15.4 33.2L13.8 24.4C13 22.8 12.2 22.8 11.4 24.4L9.8 33.2C8.6 38.4 5.4 35.2 4.2 27.2C2.6 18.4 0 14.4 0.6 6.8Z" stroke="url(#ldg)"/>
      <path d="M0.6 6.8C0.2 1.2 8.2 0 12.6 3.2C17 0 25 1.2 24.6 6.8C25.2 14.4 22.6 18.4 21 27.2C19.8 35.2 16.6 38.4 15.4 33.2L13.8 24.4C13 22.8 12.2 22.8 11.4 24.4L9.8 33.2C8.6 38.4 5.4 35.2 4.2 27.2C2.6 18.4 0 14.4 0.6 6.8Z" transform="translate(17.4 0)" style="stroke:var(--ld-b)" clip-path="url(#ldc)"/>
